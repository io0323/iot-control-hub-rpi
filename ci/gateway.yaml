# 契約テスト用（make contract・CI）。Mosquitto は docker compose のサービス名 mosquitto。
# UART のパスは契約テストが作る pty（--uart {uart}）で渡す。プロファイルは実行ファイルの ../share/iot-gw/profiles
site: home
mqtt:
  host: mosquitto
  port: 1883
log_level: info
# 履歴DB と gwctl のソケット（契約テストはコンテナの中で毎回新しく作る。結合テストはテストごとに上書きする）
history:
  db_path: /tmp/iot-gw-ci/history.db
admin:
  socket: /tmp/iot-gw-ci/gwctl.sock
